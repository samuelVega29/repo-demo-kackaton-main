<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scapder</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 24%, rgba(255, 123, 25, 0.2), transparent 34%),
          linear-gradient(145deg, #ffffff 0%, #eef6ff 48%, #fff3e8 100%);
        color: #111827;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .shell {
        width: 100%;
        padding: 38px 42px 32px;
        text-align: center;
      }

      .logo {
        width: 315px;
        height: 315px;
        margin: 0 auto 22px;
        object-fit: contain;
        filter: drop-shadow(0 28px 34px rgba(15, 23, 42, 0.18));
        animation: float 2.2s ease-in-out infinite;
      }

      .brand {
        margin: 0;
        font-size: 46px;
        font-weight: 900;
        letter-spacing: 0;
      }

      .subtitle {
        margin: 8px 0 28px;
        color: #4b5563;
        font-size: 15px;
        font-weight: 650;
      }

      .progress {
        width: 270px;
        height: 8px;
        margin: 0 auto;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(17, 24, 39, 0.12);
      }

      .bar {
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #ff7a18, #00a6ff);
        animation: loading 1.15s ease-in-out infinite;
      }

      .status {
        margin-top: 14px;
        color: #111827;
        font-size: 13px;
        font-weight: 750;
      }

      @keyframes loading {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(260%);
        }
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-8px);
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <img class="logo" src="assets/robot-login.png" alt="Scapder" />
      <h1 class="brand">Scapder</h1>
      <p class="subtitle">Preparando analisis, IA y reportes locales</p>
      <div class="progress" aria-hidden="true">
        <div class="bar"></div>
      </div>
      <div class="status">Iniciando motor de vision...</div>
    </main>
  </body>
</html>
